<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrandGap — Where brand becomes growth</title>
    <meta
      name="description"
      content="BrandGap is a brand-and-growth partner for premium beauty and personal care. Brand and growth, built together — and accountable to a number."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F4E9E1" />

    <!-- %VITE_SITE_URL% comes from .env — replace it there with the live domain. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrandGap" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="BrandGap — Where brand becomes growth" />
    <meta property="og:description" content="A brand-and-growth partner for premium beauty and personal care." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <!-- Share image: 1200 × 630 at public/og-image.png (currently a labelled placeholder). -->
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BrandGap — Where brand becomes growth" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrandGap — Where brand becomes growth" />
    <meta name="twitter:description" content="A brand-and-growth partner for premium beauty and personal care." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Organisation — facts from the brand guidelines only -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BrandGap",
        "slogan": "Where brand becomes growth.",
        "description": "A brand-and-growth partner for premium beauty and personal care.",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/favicon.svg"
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/baskervville-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
